spring:
  application:
    name: intellij-plugin-loc-service
  main:
    allow-bean-definition-overriding: true
  data:
    mongodb:
      uri: mongodb://localhost:27017/genai_loc_db
      auto-index-creation: true
      show-sql: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    try-it-out-enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true

logging:
  level:
    com.cts.plugin.loc: DEBUG
    org.springframework.data.mongodb: INFO

data:
  web:
    pageable:
      default-page-size: 50   # default number of items per page
      max-page-size: 100      # maximum allowed page size
      one-indexed-parameters: false  # set to true if you want page numbers to start from 1